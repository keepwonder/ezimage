name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Cover the platforms users actually run VS Code on. Each cell exercises
        # the full pipeline: type check, compile, package, smoke test.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # On Windows runners setup-python installs `python.exe` but not `python3`.
      # Add `python3` to PATH so scripts that hard-code `python3` (like our
      # packaging helpers) work everywhere.
      - name: Symlink python3 on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $py = (Get-Command python).Source
          $dir = Split-Path $py
          $target = Join-Path $dir "python3.exe"
          if (-not (Test-Path $target)) {
            Copy-Item $py $target
            Write-Host "Created python3.exe shim -> $target"
          }
          python3 --version

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Install PyYAML for Issue template lint
        run: pip install pyyaml

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Compile
        run: npm run compile

      # 1) Local Python packager (fast preview + smoke test)
      - name: Debug Python on Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "which python: $(Get-Command python -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "which python3: $(Get-Command python3 -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "python3 --version:"
          python3 --version 2>&1
          Write-Host "PATH: $env:PATH"

      - name: Package VSIX (Python) + smoke test
        run: python3 scripts/package-vsix.py --verify ezimage-local.vsix

      - name: Upload local-packaged VSIX artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ezimage-vsix-local
          path: ezimage-local.vsix
          if-no-files-found: error
          retention-days: 7

      # 2) Real @vscode/vsce packaging (the canonical source of truth for
      #    marketplace submission). This catches any divergence between our
      #    Python ignore parser and the official one.
      - name: Package VSIX (real vsce)
        run: npx --yes @vscode/vsce package --no-git-tag-version --out ezimage-vsce.vsix

      - name: Smoke-test vsce-packaged VSIX
        run: |
          mkdir -p /tmp/vsix-extract
          unzip -q ezimage-vsce.vsix -d /tmp/vsix-extract
          cd /tmp/vsix-extract/extension
          node -e "const s = require('@aws-sdk/client-s3'); if (typeof s.S3Client !== 'function') process.exit(1); console.log('vsce-packaged VSIX: S3Client ok');"

      - name: Compare VSIX sizes (sanity check)
        if: matrix.os == 'ubuntu-latest'
        run: |
          LOCAL_MB=$(stat -c %s ezimage-local.vsix 2>/dev/null || stat -f %z ezimage-local.vsix)
          LOCAL_MB=$(awk "BEGIN { printf \"%.2f\", ${LOCAL_MB}/1024/1024 }")
          echo "Local Python-packaged VSIX: ${LOCAL_MB} MB"

          VSCE_MB=$(stat -c %s ezimage-vsce.vsix 2>/dev/null || stat -f %z ezimage-vsce.vsix)
          VSCE_MB=$(awk "BEGIN { printf \"%.2f\", ${VSCE_MB}/1024/1024 }")
          echo "Official vsce-packaged VSIX: ${VSCE_MB} MB"

          # Local should be within 50% of vsce (allowing for the synthetic
          # extension.vsixmanifest we inject vs the real one vsce generates)
          echo "Delta: ${LOCAL_MB} vs ${VSCE_MB} MB"

      - name: Upload vsce-packaged VSIX artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ezimage-vsix-vsce
          path: ezimage-vsce.vsix
          if-no-files-found: error
          retention-days: 7

      # 3) Regression guard: VSIX size must stay under 5 MB
      - name: Size regression check
        if: matrix.os == 'ubuntu-latest'
        run: |
          VSIX_SIZE=$(stat -c %s ezimage-vsce.vsix 2>/dev/null || stat -f %z ezimage-vsce.vsix)
          VSIX_MB=$(awk "BEGIN { printf \"%.2f\", ${VSIX_SIZE}/1024/1024 }")
          echo "VSIX size: ${VSIX_MB} MB"
          if [ "$(awk "BEGIN { print (${VSIX_MB} > 5) }")" = "1" ]; then
            echo "::error::VSIX is ${VSIX_MB} MB, expected < 5 MB. .vscodeignore likely regressed."
            exit 1
          fi

      # 4) Validate GitHub Issue templates parse as YAML with the schema
      #    GitHub expects (top-level name/description/body, body items have
      #    type + attributes). Catches regressions before they ship.
      - name: Validate Issue templates
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -e
          for f in .github/ISSUE_TEMPLATE/*.yml; do
            echo "Checking $f ..."
            # Use environment variables (export) rather than heredoc interpolation
            # so shell expansion inside the heredoc behaves predictably across
            # macOS/Linux/Windows runners.
            export TEMPLATE_FILE="$f"
            if [ "$(basename "$f")" = "config.yml" ]; then
              python3 - <<'PY'
          import os, sys, yaml
          f = os.environ["TEMPLATE_FILE"]
          with open(f) as fp:
              data = yaml.safe_load(fp)
          if not isinstance(data, dict):
              print(f"::error::{f}: top-level is not a mapping")
              sys.exit(1)
          print(f"  ok ({f}) [config schema]")
          PY
            else
              python3 - <<'PY'
          import os, sys, yaml
          f = os.environ["TEMPLATE_FILE"]
          with open(f) as fp:
              data = yaml.safe_load(fp)
          if not isinstance(data, dict):
              print(f"::error::{f}: top-level is not a mapping")
              sys.exit(1)
          if "name" not in data or "description" not in data:
              print(f"::error::{f}: missing required name/description")
              sys.exit(1)
          if "body" in data:
              for item in data["body"]:
                  if "type" not in item or "attributes" not in item:
                      print(f"::error::{f}: body item missing type or attributes")
                      sys.exit(1)
          print(f"  ok ({f})")
          PY
            fi
          done

      # 5) Validate .versionrc.json parses (catches release automation breakage)
      - name: Validate .versionrc.json
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -c "
          import json
          with open('.versionrc.json') as f:
              data = json.load(f)
          assert 'types' in data, 'missing types'
          assert 'tagPrefix' in data, 'missing tagPrefix'
          print('  ok (.versionrc.json)')
          "
